name: Harmonic claim bot

on:
  schedule:
    # Rounds stay claimable for 24h and 144 stack up (confirmed via
    # /api/claim/clock and the site's own claim desk), so hourly claims
    # exactly as much as a tighter interval would, with a big safety
    # margin against a single missed run.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python3 claim_bot.py 0x819fc86a60a820b7c9ed468cd94cdc719970c0f5 --once
